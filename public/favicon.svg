<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- App icon: a white hanger on a frosted-glass tile over the app's dark-blue waves. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A2E57" />
      <stop offset="1" stop-color="#020B12" />
    </linearGradient>
    <!-- Frosted pane: brighter at the top, fading down. -->
    <linearGradient id="pane" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.28" />
      <stop offset="0.5" stop-color="#fff" stop-opacity="0.1" />
      <stop offset="1" stop-color="#fff" stop-opacity="0.05" />
    </linearGradient>
    <!-- Rim light: strong top-left, faint in the middle, cool glint bottom-right. -->
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.9" />
      <stop offset="0.4" stop-color="#fff" stop-opacity="0.12" />
      <stop offset="1" stop-color="#AAE6FF" stop-opacity="0.6" />
    </linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7" />
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#000" flood-opacity="0.45" />
    </filter>
    <clipPath id="tile">
      <rect width="64" height="64" rx="16" />
    </clipPath>
  </defs>

  <g clip-path="url(#tile)">
    <rect width="64" height="64" fill="url(#bg)" />
    <!-- Soft light blobs behind the glass, so the frost has something to blur. -->
    <circle cx="14" cy="50" r="16" fill="#1B6CA8" filter="url(#blur)" />
    <circle cx="54" cy="12" r="13" fill="#3FA9E0" opacity="0.7" filter="url(#blur)" />

    <!-- Glass pane with rim light and a top sheen. -->
    <rect x="6" y="6" width="52" height="52" rx="13" fill="url(#pane)" />
    <rect x="6.6" y="6.6" width="50.8" height="50.8" rx="12.4" fill="none" stroke="url(#rim)" stroke-width="1.2" />
    <path d="M12 7.5h40a5 5 0 0 1 5 5v4c-10 5-40 5-50 0v-4a5 5 0 0 1 5-5z" fill="#fff" opacity="0.12" />
  </g>

  <!-- Hanger (24-unit grid scaled to fit the pane). -->
  <g transform="translate(12.2 13.9) scale(1.65)" fill="none" stroke="#fff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" filter="url(#shadow)">
    <path d="M14 6a2 2 0 1 0-4 0c0 1.7.7 3 2 4M12 10l8.2 4.6a1.6 1.6 0 0 1 .8 1.4v.4a1.6 1.6 0 0 1-1.6 1.6H4.6A1.6 1.6 0 0 1 3 16.4V16a1.6 1.6 0 0 1 .8-1.4z" />
  </g>
</svg>
